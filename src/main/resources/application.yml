spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vpn_bot}
    username: ${SPRING_DATASOURCE_USERNAME:vpn_user}
    password: ${SPRING_DATASOURCE_PASSWORD:vpn_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:supersecret123}
      timeout: 2s

app:
  rate-limit:
    window-seconds: 3
    max-requests: 3
  idempotency:
    ttl-seconds: 10
    update-ttl-seconds: 600
  vpn-keys:
    unused-ttl-hours: 24
    cleanup-delay-ms: 3600000
  subscriptions:
    notify-delay-ms: 3600000
    expire-check-delay-ms: 300000
  payments:
    reconcile-delay-ms: 60000
    fast-check-delays-ms: 3000,8000,15000
  subscription-plans:
    plan1:
      months: 1
      days: 30
      price: 100
      label: "1 месяц"
    plan2:
      months: 2
      days: 60
      price: 170
      label: "2 месяца"
  referral:
    referrer-days: 7
    referred-days: 3
  subscription-proxy:
    base-url: ${APP_SUBSCRIPTION_PROXY_BASE_URL:}
    title: ${APP_SUBSCRIPTION_TITLE:WayGuard}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME}
  admin-ids: ${TELEGRAM_ADMIN_IDS:980389038}
  support-username: ${TELEGRAM_SUPPORT_USERNAME:@xdersee}
  main-menu-text: |-
    👋 WayGuard

    Подключение VPN без лишних шагов.
    Здесь можно:
    • выбрать тариф
    • получить subscription-ссылку
    • управлять своими ключами
  instructions-text: |-
    📘 Как подключить VPN

    1. Откройте раздел «🔑 Мои ключи».
    2. Нажмите «📋 Получить ссылку».
    3. Установите Happ:
       iOS: https://apps.apple.com/ru/app/happ-proxy-utility-plus/id6746188973?l=en-GB
       Android: https://play.google.com/store/apps/details?id=com.happproxy
    4. Скопируйте subscription-ссылку и добавьте её в Happ.

    Важно:
    • копируйте ссылку полностью
    • одна subscription-ссылка уже содержит все доступные подключения
    • если соединение работает нестабильно, замените ключ в разделе «Мои ключи»

